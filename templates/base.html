<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель заказов — Bootstrap 5</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" href="styles.css">
</head>

<header class="topbar py-3">
        <div class="container-fluid px-3 px-md-4">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                <!-- Логотип -->
                <div class="d-flex align-items-center gap-2">
                    <div class="logo-icon">
                        <i class="bi bi-box"></i>
                    </div>
                    <span class="logo-text">StroyMasterDon</span>
                </div>

                <!-- Пользователь + выход -->
                <div class="d-flex align-items-center gap-3">
                    <div class="user-badge d-flex align-items-center gap-2">
                        <div class="avatar">АК</div>
                        <span class="fw-semibold text-dark small">Алексей Ковалёв</span>
                    </div>
                    <button class="btn btn-outline-secondary rounded-pill px-3 d-flex align-items-center gap-2 fw-semibold small">
                        <i class="bi bi-box-arrow-right"></i>
                        <span class="d-none d-sm-inline">Выйти</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

<!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Собственный скрипт -->
    <script src="script.js"></script>
</html>
