<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель заказов — Bootstrap 5</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Верхняя панель -->
    <header class="topbar py-3">
        <div class="container-fluid px-3 px-md-4">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <div class="logo-icon">
                        <i class="bi bi-box"></i>
                    </div>
                    <span class="logo-text">OrderFlow</span>
                    <button class="btn btn-primary rounded-pill px-3 ms-2 d-flex align-items-center gap-2 fw-semibold small"
                            data-bs-toggle="modal" data-bs-target="#orderModal" id="newOrderBtn">
                        <i class="bi bi-plus-lg"></i>
                        <span class="d-none d-sm-inline">Новый заказ</span>
                    </button>
                    <button class="btn btn-outline-primary rounded-pill px-3 d-flex align-items-center gap-2 fw-semibold small"
                            data-bs-toggle="modal" data-bs-target="#productModal" id="newProductBtn">
                        <i class="bi bi-box-seam"></i>
                        <span class="d-none d-sm-inline">Новый товар</span>
                    </button>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <div class="user-badge d-flex align-items-center gap-2">
                        <div class="avatar">АК</div>
                        <span class="fw-semibold text-dark small">Алексей Ковалёв</span>
                    </div>
                    <button class="btn btn-outline-secondary rounded-pill px-3 d-flex align-items-center gap-2 fw-semibold small">
                        <i class="bi bi-box-arrow-right"></i>
                        <span class="d-none d-sm-inline">Выйти</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container-fluid px-3 px-md-4 py-4 main-wrapper">

        <!-- Фильтры + поиск -->
        <div class="row g-3 align-items-center mb-4">
            <div class="col-12 col-lg-auto">
                <div class="filters-card d-flex flex-wrap align-items-center gap-3 px-4 py-2">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-tag text-secondary"></i>
                        <span class="text-secondary fw-medium small">Статус:</span>
                        <select class="form-select form-select-sm w-auto" id="statusFilter">
                            <option value="all">Все</option>
                            <option value="paid">Оплачен</option>
                            <option value="pending">В ожидании</option>
                            <option value="shipped">Отправлен</option>
                            <option value="cancelled">Отменён</option>
                        </select>
                    </div>
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <i class="bi bi-calendar-alt text-secondary"></i>
                        <span class="text-secondary fw-medium small">Период:</span>
                        <input type="date" class="form-control form-control-sm date-input" id="dateFrom" value="2025-01-01">
                        <span class="text-secondary">—</span>
                        <input type="date" class="form-control form-control-sm date-input" id="dateTo" value="2025-12-31">
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg ms-lg-auto">
                <div class="search-wrapper ms-lg-auto">
                    <i class="bi bi-search"></i>
                    <input type="text" class="form-control" id="searchOrder" placeholder="Поиск по номеру заказа...">
                </div>
            </div>
        </div>

        <!-- Таблица заказов -->
        <div class="table-card mb-4">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Дата</th>
                            <th>Клиент</th>
                            <th>Сумма</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Пагинация -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mt-2">
            <div class="text-secondary small fw-medium" id="paginationInfo">Показано 0 из 0</div>
            <nav>
                <ul class="pagination mb-0" id="pagination"></ul>
            </nav>
        </div>

    </main>

    <!-- ================= МОДАЛЬНОЕ ОКНО ЗАКАЗА ================= -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="orderModalLabel">Новый заказ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>

                <div class="modal-body">

                    <!-- Блок «Клиент» -->
                    <section class="order-block mb-4">
                        <h6 class="block-title"><i class="bi bi-person"></i> Клиент</h6>
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <select class="form-select flex-grow-1" id="clientSelect" style="min-width: 220px;">
                                <option value="">— Выберите клиента —</option>
                                <option value="ООО «Ромашка»">ООО «Ромашка»</option>
                                <option value="ИП Смирнов">ИП Смирнов</option>
                                <option value="ООО «ТехноСерв»">ООО «ТехноСерв»</option>
                                <option value="ООО «Альфа-Трейд»">ООО «Альфа-Трейд»</option>
                                <option value="Иванов И.И.">Иванов И.И.</option>
                                <option value="ООО «СтройМастер»">ООО «СтройМастер»</option>
                                <option value="Петрова А.С.">Петрова А.С.</option>
                                <option value="ООО «Мега-Групп»">ООО «Мега-Групп»</option>
                            </select>
                            <button type="button" class="btn btn-outline-primary rounded-pill px-3" id="newClientBtn">
                                <i class="bi bi-person-plus"></i> Новый клиент
                            </button>
                        </div>
                        <div class="mt-2 d-none" id="newClientFields">
                            <div class="row g-2">
                                <div class="col-12 col-sm-6">
                                    <input type="text" class="form-control form-control-sm" id="newClientName" placeholder="Название / ФИО клиента">
                                </div>
                                <div class="col-12 col-sm-6">
                                    <input type="text" class="form-control form-control-sm" id="newClientPhone" placeholder="Телефон (необязательно)">
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Блок «Товары» -->
                    <section class="order-block mb-4">
                        <h6 class="block-title"><i class="bi bi-cart"></i> Товары</h6>

                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <div class="product-search-wrapper flex-grow-1">
                                <i class="bi bi-search"></i>
                                <input type="text" class="form-control form-control-sm" id="productSearch"
                                       placeholder="Поиск товара по названию или артикулу..." autocomplete="off">
                                <div class="product-suggestions d-none" id="productSuggestions"></div>
                            </div>
                            <button type="button" class="btn btn-primary rounded-pill px-3" id="addProductBtn" disabled>
                                <i class="bi bi-plus-lg"></i> Добавить
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-sm align-middle mb-0 items-table">
                                <thead>
                                    <tr>
                                        <th>Товар</th>
                                        <th class="text-center" style="width: 130px;">Кол-во</th>
                                        <th class="text-end" style="width: 110px;">Цена</th>
                                        <th class="text-end" style="width: 120px;">Сумма</th>
                                        <th style="width: 50px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="itemsTableBody">
                                    <tr id="itemsEmptyRow">
                                        <td colspan="5" class="text-center text-secondary py-4">
                                            <i class="bi bi-inbox d-block mb-1 fs-5"></i>
                                            Добавьте товары в заказ
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <!-- Блок «Итого» -->
                    <section class="order-block total-block">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-semibold text-secondary"><i class="bi bi-calculator"></i> Итого:</span>
                            <span class="total-amount" id="orderTotal">0 ₽</span>
                        </div>
                    </section>

                </div>

                <div class="modal-footer d-flex flex-wrap gap-2 justify-content-between">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">
                        Отмена
                    </button>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-outline-primary rounded-pill px-3" id="saveAndShipBtn">
                            <i class="bi bi-truck"></i> Сохранить и отправить на склад
                        </button>
                        <button type="button" class="btn btn-primary rounded-pill px-4" id="saveOrderBtn">
                            <i class="bi bi-check-lg"></i> Сохранить
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= МОДАЛЬНОЕ ОКНО ТОВАРА ================= -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="productModalLabel">Новый товар</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>

                <div class="modal-body">

                    <!-- Основные поля товара -->
                    <section class="order-block mb-4">
                        <h6 class="block-title"><i class="bi bi-box-seam"></i> Данные товара</h6>

                        <div class="row g-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label small fw-semibold text-secondary">Артикул <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="productSku" placeholder="Например: NB-LN-001">
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label small fw-semibold text-secondary">Наименование <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="productName" placeholder="Например: Шпаклёвка">
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label small fw-semibold text-secondary">Категория <span class="text-danger">*</span></label>
                                <select class="form-select" id="productCategory">
                                    <option value="">— Выберите категорию —</option>
                                    <option value="Шпаклёвка">Шпаклёвка</option>
                                    <option value="Грунтовка">Грунтовка</option>
                                    <option value="Саморезы">Саморезы</option>
                                    <option value="Цемент">Цемент</option>
                                    <option value="Гипсокартон">Гипсокартон</option>
                                    <option value="Монтажная пена">Монтажная пена</option>
                                    <option value="Краска интерьерная">Краска интерьерная</option>
                                </select>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label small fw-semibold text-secondary">Единица измерения <span class="text-danger">*</span></label>
                                <select class="form-select" id="productUnit">
                                    <option value="">— Выберите —</option>
                                    <option value="шт.">шт.</option>
                                    <option value="компл.">компл.</option>
                                    <option value="кг">кг</option>
                                    <option value="м">м</option>
                                    <option value="л">л</option>
                                    <option value="упак.">упак.</option>
                                </select>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label small fw-semibold text-secondary">Цена, ₽ <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="productPrice" placeholder="0" min="0" step="0.01">
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-semibold text-secondary">Описание</label>
                                <textarea class="form-control" id="productDescription" rows="3"
                                          placeholder="Краткое описание товара (необязательно)"></textarea>
                            </div>
                        </div>
                    </section>

                    <!-- Блок «Остаток» -->
                    <section class="order-block stock-block">
                        <h6 class="block-title"><i class="bi bi-boxes"></i> Остаток на складе</h6>
                        <div class="d-flex flex-wrap align-items-center gap-3">
                            <div class="stock-value">
                                <span class="stock-number" id="productStock">0</span>
                                <span class="text-secondary small" id="productStockUnit">шт.</span>
                            </div>
                            <button type="button" class="btn btn-outline-primary rounded-pill px-3" id="stockInBtn" disabled>
                                <i class="bi bi-plus-circle"></i> Поступление
                            </button>
                        </div>
                        <div class="mt-2 d-none" id="stockInFields">
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <input type="number" class="form-control form-control-sm stock-in-input" id="stockInQty"
                                       placeholder="Кол-во" min="1" step="1" value="1">
                                <button type="button" class="btn btn-primary btn-sm rounded-pill px-3" id="stockInConfirm">
                                    <i class="bi bi-check-lg"></i> Принять
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="stockInCancel">
                                    Отмена
                                </button>
                            </div>
                        </div>
                    </section>

                </div>

                <div class="modal-footer d-flex flex-wrap gap-2 justify-content-between">
                    <button type="button" class="btn btn-outline-danger rounded-pill px-3" id="deleteProductBtn">
                        <i class="bi bi-trash"></i> Удалить
                    </button>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">
                            Отмена
                        </button>
                        <button type="button" class="btn btn-primary rounded-pill px-4" id="saveProductBtn">
                            <i class="bi bi-check-lg"></i> Сохранить
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
