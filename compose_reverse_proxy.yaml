version: '3.8'

services:
  # Контейнер с вашим приложением (например, Python/Node.js/Go)
  app:
    build: .
    container_name: prod_app
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - static_volume:/app/static
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - app
    networks:
      - app_network

volumes:
  static_volume:

networks:
  app_network:
    driver: bridge
